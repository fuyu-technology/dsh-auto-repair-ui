- insert:
    - id: dsh-auto-repair-ui
      name: 'dsh-auto-repair-ui'

# ── 模型路由（bundle 层）────────────────────────────────────────────────────
# 由「模型供应商」页自动生成：预设厂商 + 用户自定义厂商都在这里注册。
# 用 DSH 自带的 @deepseek-ai/dsh-llm-pi-ai，不新增第三方依赖。
#
# ⚠ 写在 bundle 层：DSH 保存设置时会重写 profile 的 cordis.patch.yml，
#   并抹掉它不管理的行（见 auto-repair/README.md「QQ 桥接掉了」的根因）。
#   bundle 层只在启动时读取、永不被写回，所以注册放这里最稳。
#
# Key 不在本文件里：填在 DSH 设置里配置凭据，或写进
# ~/.dsh/.credentials.yaml 的 refs: 下，或使用同名环境变量。
# 新增/删除供应商后需要重启一次 DSH 才会加载新路由。
- insert:
    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          zhipu:
            apiKeyEnv: ZHIPU_API_KEY
            displayName: '智谱 GLM'
            api: openai-completions
            baseURL: 'https://open.bigmodel.cn/api/paas/v4'
            models:
              - { id: 'glm-5.3', name: 'GLM-5.3', contextWindow: 200000 }
              - { id: 'glm-5.3-flash', name: 'GLM-5.3-Flash', contextWindow: 200000, input: [text, image] }
              - { id: 'glm-5.3-flashx', name: 'GLM-5.3-FlashX', contextWindow: 200000 }
              - { id: 'glm-5.2', name: 'GLM-5.2', contextWindow: 200000 }
              - { id: 'glm-5.1', name: 'GLM-5.1', contextWindow: 200000 }
              - { id: 'glm-5', name: 'GLM-5', contextWindow: 200000 }
              - { id: 'glm-5-turbo', name: 'GLM-5-Turbo', contextWindow: 200000 }
              - { id: 'glm-4.7', name: 'GLM-4.7', contextWindow: 200000 }
              - { id: 'glm-4.7-flashx', name: 'GLM-4.7-FlashX', contextWindow: 200000 }
              - { id: 'glm-4.6', name: 'GLM-4.6', contextWindow: 200000 }
              - { id: 'glm-4.5-air', name: 'GLM-4.5-Air', contextWindow: 128000 }
              - { id: 'glm-4.5-airx', name: 'GLM-4.5-AirX', contextWindow: 128000 }
              - { id: 'glm-4-long', name: 'GLM-4-Long', contextWindow: 1000000 }
              - { id: 'glm-4.7-flash', name: 'GLM-4.7-Flash', contextWindow: 200000 }
              - { id: 'glm-4.5-flash', name: 'GLM-4.5-Flash', contextWindow: 128000 }
              - { id: 'glm-4-flash-250414', name: 'GLM-4-Flash-250414', contextWindow: 128000 }
              - { id: 'glm-5v-turbo', name: 'GLM-5V-Turbo', contextWindow: 200000, input: [text, image] }
              - { id: 'glm-4.6v', name: 'GLM-4.6V', contextWindow: 128000, input: [text, image] }
              - { id: 'glm-4.6v-flash', name: 'GLM-4.6V-Flash', contextWindow: 128000, input: [text, image] }
              - { id: 'glm-4.1v-thinking-flashx', name: 'GLM-4.1V-Thinking-FlashX', contextWindow: 128000, input: [text, image] }
              - { id: 'glm-4v-flash', name: 'GLM-4V-Flash', contextWindow: 128000, input: [text, image] }
          minimax:
            apiKeyEnv: MINIMAX_API_KEY
            displayName: 'MiniMax（国际站）'
            api: anthropic-messages
            baseURL: 'https://api.minimax.io/anthropic'
            models:
              - { id: 'MiniMax-M3.1-Flash', name: 'MiniMax-M3.1-Flash' }
              - { id: 'MiniMax-M2.7', name: 'MiniMax-M2.7' }
              - { id: 'MiniMax-M2.7-highspeed', name: 'MiniMax-M2.7-highspeed' }
              - { id: 'MiniMax-M3', name: 'MiniMax-M3' }
          minimax-cn:
            apiKeyEnv: MINIMAX_CN_API_KEY
            displayName: 'MiniMax（国内站）'
            api: anthropic-messages
            baseURL: 'https://api.minimaxi.com/anthropic'
            models:
              - { id: 'MiniMax-M2.7', name: 'MiniMax-M2.7' }
              - { id: 'MiniMax-M2.7-highspeed', name: 'MiniMax-M2.7-highspeed' }
              - { id: 'MiniMax-M3', name: 'MiniMax-M3' }
          openai:
            apiKeyEnv: OPENAI_API_KEY
            displayName: 'OpenAI'
            api: openai-completions
            baseURL: 'https://api.openai.com/v1'
            models:
              - { id: 'gpt-5.5', name: 'GPT-5.5', contextWindow: 1050000 }
              - { id: 'gpt-5.5-pro', name: 'GPT-5.5 Pro', contextWindow: 1050000 }
              - { id: 'gpt-5.4', name: 'GPT-5.4', contextWindow: 1000000 }
